<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#14171c; --sub:#5b6370; --line:#e6e9ee;
  --mob:#0f9d8a; --mob-bg:#e3f6f3; --stb:#e8590c; --stb-bg:#fff0e6;
  --accent:#14171c; --done:#2f9e44; --shadow:0 1px 2px rgba(20,23,28,.04),0 4px 16px rgba(20,23,28,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --card:#181b21; --ink:#f1f3f5; --sub:#9aa3b0; --line:#262a32;
  --mob:#3cc9b4; --mob-bg:#11312c; --stb:#ff8a4c; --stb-bg:#3a2216; --accent:#f1f3f5; --done:#51cf66;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#181b21; --ink:#f1f3f5; --sub:#9aa3b0; --line:#262a32;
  --mob:#3cc9b4; --mob-bg:#11312c; --stb:#ff8a4c; --stb-bg:#3a2216; --accent:#f1f3f5; --done:#51cf66; --shadow:none;}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 80px}
.brow{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--stb)}
header h1{font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
header p{color:var(--sub);font-size:15px;margin-top:2px}
.share{min-height:48px;padding:0 18px;border-radius:14px;background:var(--accent);color:var(--bg);font-weight:700;font-size:15px;white-space:nowrap}
.share:active{transform:scale(.97)}
@media(max-width:520px){.share{width:100%}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--accent);color:var(--bg);padding:13px 20px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:40;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.site-foot{margin-top:14px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--sub);text-align:center;line-height:1.6}
.site-foot b{color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--stb);outline-offset:2px}
html{-webkit-tap-highlight-color:transparent}
.flow{display:flex;gap:6px;align-items:center;margin-top:14px;font-size:13px;font-weight:700;flex-wrap:wrap}
.flow span{padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.flow i{color:var(--sub);font-style:normal}

.search{display:flex;align-items:center;gap:10px;margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 14px}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;padding:13px 0;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.search button{font-size:22px;color:var(--sub);padding:4px}
.from{font-size:12px;font-weight:700;color:var(--sub)}
mark{background:color-mix(in srgb,var(--stb) 25%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.mpic{margin-top:14px;border-radius:16px;background:#fbf1e3;overflow:hidden;display:flex;justify-content:center}
.mpic img{max-height:min(46vh,420px);width:auto;max-width:100%;display:block}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
.yt{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:10px;padding:13px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;font-size:15px;color:var(--ink);text-decoration:none}
.yt:hover{border-color:var(--ink)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-top:16px}
@media(min-width:900px){.cats{grid-template-columns:repeat(8,1fr)}}
.cat{min-height:68px;padding:8px 4px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700;line-height:1.25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;word-break:keep-all;transition:.15s}
.cat .e{font-size:20px;line-height:1}
.cat:active{transform:scale(.96)}
.cat.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 14px;flex-wrap:wrap}
.bar h2{font-size:22px;font-weight:900}
.bar .desc{color:var(--sub);font-size:14px;margin-top:2px}
.filters{display:flex;gap:6px}
.f{padding:7px 12px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--sub)}
.f.on{color:var(--ink);border-color:var(--ink)}

.prog{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:16px}
.prog .track{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog .fill{height:100%;background:var(--done);width:0;transition:width .3s}
.prog b{font-size:14px;white-space:nowrap}
.prog button{font-size:12px;color:var(--sub);text-decoration:underline}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative}
.card:hover{transform:translateY(-2px);border-color:var(--sub)}
.card.done{opacity:.6}
.card.done .name{text-decoration:line-through;text-decoration-thickness:2px}
.top{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.tag.m{color:var(--mob);background:var(--mob-bg)}
.tag.s{color:var(--stb);background:var(--stb-bg)}
.step{font-size:12px;color:var(--sub);font-weight:700}
.name{font-size:20px;font-weight:900;letter-spacing:-.01em;line-height:1.3}
.name small{display:block;font-size:12px;font-weight:500;color:var(--sub);letter-spacing:0;margin-top:2px}
.mus{font-size:13px;display:grid;gap:3px}
.mus div{display:flex;gap:8px}
.mus em{font-style:normal;color:var(--sub);flex:0 0 42px;font-weight:700}
.cues{list-style:none;display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:12px}
.cues li{font-size:14px;padding-left:18px;position:relative}
.cues li::before{content:"";position:absolute;left:3px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.more{font-size:13px;color:var(--sub);font-weight:700}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;min-height:44px;padding:0 14px 0 10px;border-radius:99px;border:1px solid var(--line)}
.f{min-height:40px}
.chk .box{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:.15s}
.card.done .chk{border-color:var(--done);color:var(--done)}
.card.done .chk .box{background:var(--done);border-color:var(--done)}
.card.done .chk .box::after{content:"✓";color:#fff;font-size:12px;font-weight:900}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,12,16,.55);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.ov.open{display:flex}
.modal{background:var(--card);width:100%;max-width:620px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:24px 20px 28px;animation:up .22s ease}
@media(min-width:700px){.ov{align-items:center;padding:20px}.modal{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{font-size:26px;line-height:1;color:var(--sub);padding:4px}
.modal h3{font-size:24px;font-weight:900;margin-top:10px;line-height:1.3}
.sec{margin-top:20px}
.sec h4{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:8px;letter-spacing:.02em}
.dose{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dose div{background:var(--bg);border-radius:12px;padding:12px}
.dose b{display:block;font-size:12px;color:var(--sub)}
.dose span{font-size:16px;font-weight:700}
.cmp{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.cmp{grid-template-columns:1fr 1fr}}
.cmp .box2{border-radius:14px;padding:14px;font-size:14px}
.cmp .good{background:color-mix(in srgb,var(--done) 12%,transparent)}
.cmp .bad{background:color-mix(in srgb,#e03131 12%,transparent)}
.cmp strong{display:block;margin-bottom:6px;font-size:14px}
.cmp ul{list-style:none;display:grid;gap:5px}
.mbtn{margin-top:22px;width:100%;padding:15px;border-radius:14px;background:var(--accent);color:var(--bg);font-weight:900;font-size:16px}
.mbtn.done{background:var(--done);color:#fff}
.note{margin-top:28px;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>

/* 동작 이미지: "항목id:운동순서" → 파일 */
const IMG = {};
const EMB = window.IMG_DATA || {};
DATA.forEach(c=>c.ex.forEach((_,i)=>{ const n = `${c.id}-${i}`; IMG[c.id+":"+i] = EMB[n] || `img/${n}.jpg`; }));
const $ = s => document.querySelector(s);
const today = new Date().toISOString().slice(0,10);
const KEY = "bareun-done-" + today;
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} }
};
let done = store.get();
let cur = (()=>{ try{ return localStorage.getItem("bareun-cat") || DATA[0].id; }catch(e){ return DATA[0].id; } })();
let filter = "all";
const TAG = { m:"가동성/스트레칭", s:"안정화/강화" };

function catObj(){ return DATA.find(c=>c.id===cur) || DATA[0]; }
const exKey = (c,i) => c.id + ":" + i;

function renderCats(){
  $("#cats").innerHTML = DATA.map(c=>`<button class="cat ${c.id===cur?'on':''}" data-id="${c.id}"><span class="e">${c.e}</span>${c.name}</button>`).join("");
}
let q = "";
const norm = s => s.toLowerCase().replace(/\s+/g,"");
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function hl(s){
  if(!q) return s;
  const words = q.trim().split(/\s+/).filter(Boolean).map(esc);
  return words.length ? s.replace(new RegExp("("+words.join("|")+")","gi"),"<mark>$1</mark>") : s;
}
function matches(c,x){
  const hay = norm([c.name,x.n,x.en,x.pm,x.sm,TAG[x.t],...x.cues].join(" "));
  return q.trim().split(/\s+/).every(w=>hay.includes(norm(w)));
}
function renderGrid(){
  const c = catObj(), searching = q.trim().length>0;
  let items;
  if(searching){
    items = DATA.flatMap(cc=>cc.ex.map((x,i)=>({c:cc,x,i}))).filter(o=>matches(o.c,o.x));
    $("#catTitle").textContent = `"${q.trim()}" 검색 결과`;
    $("#catDesc").textContent = `8개 항목 전체에서 ${items.length}개 운동을 찾았어요`;
  } else {
    items = c.ex.map((x,i)=>({c,x,i}));
    $("#catTitle").textContent = c.e + " " + c.name;
    $("#catDesc").textContent = c.desc;
  }
  items = items.filter(o=>filter==="all"||o.x.t===filter);
  document.querySelector(".prog").hidden = searching;
  $("#grid").innerHTML = items.length ? items.map(({c,x,i})=>{
    const k = exKey(c,i), d = !!done[k];
    return `<article class="card ${d?'done':''}" data-c="${c.id}" data-i="${i}">
      <div class="top"><span class="tag ${x.t}">${TAG[x.t]}</span><span class="${searching?'from':'step'}">${searching? c.e+' '+c.name : 'STEP '+(i+1)}</span></div>
      <div class="name">${hl(x.n)}<small>${hl(x.en)}</small></div>
      <div class="mus"><div><em>주동근</em><span>${hl(x.pm)}</span></div><div><em>보조근</em><span>${hl(x.sm)}</span></div></div>
      <ul class="cues">${x.cues.map(t=>`<li>${hl(t)}</li>`).join("")}</ul>
      <div class="foot"><span class="more">상세 티칭 ›</span>
        <button class="chk" data-k="${k}" aria-pressed="${d}"><span class="box"></span>${d?'완료':'오늘 하기'}</button></div>
    </article>`;
  }).join("") : `<div class="empty">찾는 운동이 없어요. 근육 이름(예: 둔근, 전거근)이나 운동 이름으로 검색해 보세요.</div>`;
  renderProg();
}
function renderProg(){
  const c = catObj(), total = c.ex.length;
  const n = c.ex.filter((_,i)=>done[exKey(c,i)]).length;
  $("#progTxt").textContent = `오늘 ${n}/${total} 완료`;
  $("#progFill").style.width = (total? n/total*100 : 0) + "%";
}
function toggle(k){
  if(done[k]) delete done[k]; else done[k] = true;
  store.set(done); renderGrid();
}
function openModal(cid,i){
  const c = DATA.find(d=>d.id===cid), x = c.ex[i], k = exKey(c,i);
  const yt = "https://www.youtube.com/results?search_query=" + encodeURIComponent(x.en + " " + x.n);
  const draw = () => {
    const d = !!done[k];
    $("#modal").innerHTML = `
    <div class="mh"><span class="tag ${x.t}">${TAG[x.t]}</span><button class="x" data-close aria-label="닫기">×</button></div>
    <h3>${x.n}</h3><div style="color:var(--sub);font-size:13px">${x.en} · ${c.name}</div>
    ${IMG[k]?`<div class="mpic"><img src="${IMG[k]}" alt="${x.n} 동작 시범"></div>`:''}
    <div class="sec"><h4>쓰이는 근육</h4><div class="mus"><div><em>주동근</em><span>${x.pm}</span></div><div><em>보조근</em><span>${x.sm}</span></div></div></div>
    <div class="sec"><h4>세트 · 템포 가이드</h4><div class="dose"><div><b>세트/횟수</b><span>${x.dose}</span></div><div><b>호흡·템포</b><span>${x.tempo}</span></div></div></div>
    <div class="sec"><h4>티칭 큐</h4><ul class="cues" style="border:0;padding:0">${x.cues.map(q=>`<li>${q}</li>`).join("")}</ul></div>
    <div class="sec"><h4>자세 체크포인트</h4><div class="cmp">
      <div class="box2 good"><strong>⭕ 좋은 자세</strong><ul>${x.good.map(g=>`<li>${g}</li>`).join("")}</ul></div>
      <div class="box2 bad"><strong>❌ 잘못된 자세 (보상작용)</strong><ul>${x.bad.map(g=>`<li>${g}</li>`).join("")}</ul></div>
    </div></div>
    <a class="yt" href="${yt}" target="_blank" rel="noopener">▶ 유튜브에서 동작 영상 찾아보기</a>
    <button class="mbtn ${d?'done':''}" style="margin-top:10px" data-mk="${k}">${d?'✓ 오늘 완료함 (취소하려면 누르기)':'오늘 운동 완료 체크'}</button>`;
  };
  draw();
  $("#modal").onclick = e=>{
    if(e.target.closest("[data-close]")) return closeModal();
    const b = e.target.closest("[data-mk]"); if(b){ toggle(k); draw(); }
  };
  $("#ov").classList.add("open"); document.body.style.overflow="hidden";
}
function closeModal(){ $("#ov").classList.remove("open"); document.body.style.overflow=""; }

$("#cats").onclick = e=>{
  const b = e.target.closest(".cat"); if(!b) return;
  cur = b.dataset.id; q = ""; $("#q").value = ""; $("#qx").hidden = true; try{ localStorage.setItem("bareun-cat", cur); }catch(_){}
  renderCats(); renderGrid();
};
$("#filters").onclick = e=>{
  const b = e.target.closest(".f"); if(!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".f").forEach(x=>x.classList.toggle("on", x===b));
  renderGrid();
};
$("#grid").onclick = e=>{
  const chk = e.target.closest(".chk");
  if(chk){ e.stopPropagation(); return toggle(chk.dataset.k); }
  const card = e.target.closest(".card"); if(card) openModal(card.dataset.c, +card.dataset.i);
};
$("#q").addEventListener("input", e=>{
  q = e.target.value; $("#qx").hidden = !q;
  document.querySelectorAll(".cat").forEach(b=>b.classList.toggle("on", !q.trim() && b.dataset.id===cur));
  renderGrid();
});
$("#qx").onclick = ()=>{ $("#q").value=""; q=""; $("#qx").hidden=true; renderCats(); renderGrid(); $("#q").focus(); };
$("#reset").onclick = ()=>{ const c=catObj(); c.ex.forEach((_,i)=>delete done[exKey(c,i)]); store.set(done); renderGrid(); };
$("#ov").onclick = e=>{ if(e.target.id==="ov") closeModal(); };
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

/* 링크 복사 */
let toastTimer;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}
$("#share").onclick = async ()=>{
  const url = location.href.split("#")[0];
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; }
  catch(e){
    try {
      const ta = document.createElement("textarea");
      ta.value = url; ta.setAttribute("readonly",""); ta.style.cssText = "position:fixed;top:0;opacity:0";
      document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove();
    } catch(_){}
  }
  toast(ok ? "링크가 복사됐어요! 회원에게 붙여넣기 해서 보내주세요." : "복사가 안 됐어요. 주소창 링크를 길게 눌러 복사해 주세요.");
};

/* 홈 화면 앱(PWA) 설정 */
try {
  const icon = id => document.getElementById(id)?.getAttribute("href");
  const base = location.href.split("#")[0];
  const manifest = {
    name:"김봉진 트레이너", short_name:"김봉진 트레이너", description:"일상 컨디셔닝 & 움직임 가이드",
    start_url: base, scope: new URL("./", base).href, display:"standalone", orientation:"portrait",
    background_color:"#f6f7f9", theme_color:"#f6f7f9", lang:"ko",
    icons:[{src:icon("icon192"),sizes:"192x192",type:"image/png"},{src:icon("icon512"),sizes:"512x512",type:"image/png",purpose:"any maskable"}]
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));
  document.head.appendChild(link);
} catch(e){}

renderCats(); renderGrid();
</script>
</body>
</html>
